function gCard(){const g=GA.get(),u=g.user||{};if(!u.email)return"";const init=esc((u.name||u.email||"?").trim().charAt(0).toUpperCase());
  return `<div class="card"><h3>Google account</h3>

async function gBoot(){
  if(NATIVE)slInit().catch(()=>{});
  const r=gRedirect;
  if(r&&r.ok&&(r.purpose==="login"||!signedIn())){showLogin("Signing in…");await gAfterLogin();return}
  if(!signedIn()){showLogin(r&&r.error?gErrText(r.error):"",!!(r&&r.error));return}
  hideLogin();
  if(r&&r.error){if(r.silent)GA.patch({reconnect:true,backoff:Date.now()+15*60000});else if(r.error!=="state")toast(gErrText(r.error))}
  paintTop();
  if(!navigator.onLine)return;
  if(r&&r.ok&&r.purpose==="keep"){gBackup(true);return}
  if(tokenOk()||NATIVE){await gCheck();return}
  const g=GA.get();if(g.pending&&!S.demo&&!(g.backoff>Date.now()))gBounce("backup");
}

/* ---------- Android: "new version available" popup ----------
   The build publishes version.json next to the APK. The Android app checks it when opened
   (and when brought back after 15+ minutes). "Later" hides it until the next open. */
const SITE="https://armghank.github.io/fintrack/";
const myBuild=()=>{const m=String(APP_VERSION).match(/^1\.0\.(\d+)$/);return m?+m[1]:0};
let updShown=false,updInfo=null,hiddenAt=0;
async function updFetch(){const url=SITE+"version.json?t="+Date.now();const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();j.apkUrl=new URL(j.apk||"fintrack.apk",url).href;return j}
async function updCheck(manual){
  if(!NATIVE)return;if(!manual&&(updShown||!navigator.onLine||!myBuild()))return;
  let j;try{j=await updFetch()}catch(e){if(manual)toast("Could not check for updates. Check your internet connection.");return}
  if(!(+j.code>myBuild())){if(manual)toast("FinTrack is up to date ("+APP_VERSION+").");return}
  updInfo=j;
  if($("#sheetRoot").innerHTML){if(!manual){setTimeout(()=>updCheck(false),4000)}return}
  updShown=true;updPopup()}
function updPopup(){const j=updInfo;if(!j)return;
  const notes=String(j.notes||"").split(/\n+/).map(l=>l.replace(/^\s*[•\-*]\s*/,"").trim()).filter(Boolean);
  openSheet(head("Update available")+`<div class="upd"><div class="lg-mark" style="width:52px;height:52px;border-radius:15px;font-size:20px" aria-hidden="true">FT</div>
  <div><b style="font-size:17px">FinTrack ${esc(j.version)}</b><div class="lbl">You have ${esc(APP_VERSION)}${j.date?" · released "+esc(dLong(String(j.date).slice(0,10))):""}</div></div></div>
  ${notes.length?`<div class="fl">What's new</div><ul class="updnotes">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
  <p class="lbl">Your data stays on the phone and in Google Drive. Updating takes about a minute: the new version downloads, then tap <b>Install</b> (or <b>Update</b>).</p>
  <div class="acts"><button class="btn" data-act="updLater">Later</button><a class="btn pri" href="${esc(j.apkUrl)}" data-act="updNow">Update now</a></div>`)}
document.addEventListener("visibilitychange",()=>{if(!NATIVE)return;
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>=15*60000){updShown=false;updCheck(false)}});

    try{const f=await(await dfetch(`${DRV}/files/${id}?fields=id,modifiedTime,appProperties`)).json();const B=await dDownload(f);closeSheet();gApply(B,f);toast("Loaded the version from Google Drive.")}
    catch(e){toast("Could not load it: "+e.message);if(b){b.disabled=false;b.textContent="Use Google Drive version"}}},
  gKeepPhone(){closeSheet();GA.patch({conflictId:"",pending:true});paintTop();if(tokenOk()||NATIVE)gBackup(true);else gWebAuth(true,"keep")},
  gSwitchYes(el){let user;try{user=JSON.parse(el.dataset.user)}catch(e){return}closeSheet();
    try{localStorage.removeItem("tapledger.v1")}catch(e){}S=exampleBook();fixDash();dirty=false;
    const g=GA.get();GA.set({token:g.token,exp:g.exp});try{localStorage.removeItem("tapledger.owner")}catch(e){}
    gSetUser(user);hideLogin();render();paintTop();toast("Signed in as "+(user.name||user.email));gCheck()},
  gSwitchNo(){closeSheet();GA.patch({token:"",exp:0});if(NATIVE)slInit().then(SL=>SL.logout({provider:"google"})).catch(()=>{});showLogin("Sign in with the account that owns the book on this phone.")},
  gSignOut(){if(!armed("gSignOutBtn"))return;gSignOut()},
  bkLater(){bkSnooze=true;render()},
  copyInstall(){const u=installUrl();try{navigator.clipboard.writeText(u).then(()=>toast("Link copied"),()=>toast(u))}catch(e){toast(u)}},
  wipe(){if(!armed("wipeBtn"))return;S=blankBook();markDirty();render();toast("Cleared. Press Save to make it permanent.")}
};
function showText(txt){openSheet(head("Copy backup")+`<p class="lbl">Select all and copy.</p><textarea class="inp" id="bk" readonly style="min-height:220px">${esc(txt)}</textarea>`);const t=$("#bk");t.focus();t.select()}
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.dataset.act!=="scrim")ev.preventDefault();f(el,ev)});
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id==="eform")submitForm();else if(ev.target.id==="sform")submitSched();else if(ev.target.id==="aform")submitAcc();else if(ev.target.id==="dform")submitDl();else if(ev.target.id==="pform")submitPdc()});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.dataset.d&&DF){DF[t.dataset.d]=t.value;if(t.dataset.d!=="acc"){DF.preset="custom";document.querySelectorAll('[data-act="dlPreset"]').forEach(b=>b.classList.toggle("on",b.dataset.k==="custom"))}}
  else if(t.dataset.pf&&PF){PF[t.dataset.pf]=t.value}
  else if(t.dataset.pg&&PF){PF.gen[t.dataset.pg]=t.value}
  else if(t.dataset.pc!=null&&PF){PF.chqs[+t.dataset.pc][t.dataset.k]=t.value}
  else if(t.dataset.f&&F){F[t.dataset.f]=t.value;updatePreview()}
  else if(t.dataset.jl!=null&&F){const l=F.lines[+t.dataset.jl];l[t.dataset.k]=t.value;if(t.dataset.k==="dr"&&t.value)l.cr="",document.getElementById("jl_c_"+t.dataset.jl).value="";if(t.dataset.k==="cr"&&t.value)l.dr="",document.getElementById("jl_d_"+t.dataset.jl).value="";updatePreview()}
  else if(t.dataset.s&&SF){SF[t.dataset.s]=t.value}
  else if(t.dataset.a&&AF){AF[t.dataset.a]=t.type==="checkbox"?t.checked:t.value}
  else if(t.dataset.budget){const a=acc(t.dataset.budget);a.budget=r2(t.value);markDirty()}
  else if(t.dataset.inp==="q"){U.q=t.value;const pos=t.selectionStart;render();const n=$("#dbQ");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
  else if(t.dataset.cur!=null){S.currency=t.value.trim()||"AED";markDirty()}
  else if(t.dataset.rc){const id=t.dataset.rc;if(id==="__total"){S.holdCheck=t.value===""?null:{actual:r2(t.value),date:today()};const liq=r2(liquidAccs().reduce((s,a)=>s+bal(a.id),0));$("#rd___total").innerHTML=diffChip(t.value===""?null:r2(+t.value-liq))}
    else{if(t.value==="")delete S.checks[id];else S.checks[id]={actual:r2(t.value),date:today()};$("#rd_"+id).innerHTML=diffChip(t.value===""?null:r2(+t.value-bal(id)))}markDirty()}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="xlRestore"||t.id==="xlRestore2"){restoreExcel(t.files&&t.files[0]);t.value=""}
  else if(t.dataset.reserve){S.reserve=S.reserve||{};const v=r2(t.value);if(v>0)S.reserve[t.dataset.reserve]=v;else delete S.reserve[t.dataset.reserve];markDirty();render()}
  else if(t.dataset.bk!=null){const b=BK.get();b.freq=t.value;BK.set(b);render()}
  else if(t.dataset.rep!=null&&SF){applyRep(SF,t.value);renderSched()}
  else if(t.dataset.pgrep!=null&&PF){applyRep(PF.gen,t.value);renderPdc()}
  else if(t.dataset.chg==="ledMonth"){U.ledMonth=t.value;render()}
  else if(t.dataset.chg==="dbMonth"){U.dbMonth=t.value;render()}
  else if(t.dataset.dash){S.dash.find(d=>d.id===t.dataset.dash).on=t.checked;markDirty()}
  else if(t.dataset.budget){render();const n=document.getElementById(t.id);}
  else if(t.dataset.jl!=null&&F&&t.tagName==="SELECT"){F.lines[+t.dataset.jl].a=t.value;updatePreview()}
  else if(t.dataset.s&&SF&&t.tagName==="SELECT"){SF[t.dataset.s]=t.value;if(t.dataset.s==="dr"||t.dataset.s==="cr"){}}
  else if(t.dataset.a==="archived"&&AF){AF.archived=t.checked}
});
/* chart tooltip: hover on desktop, tap on phone, focus by keyboard */
function ttTarget(n){return n&&n.closest?n.closest(".ttwrap .tt"):null}
function showTT(el){const wrap=el.closest(".ttwrap");let o;try{o=JSON.parse(el.dataset.tt)}catch(e){return}
  let tip=[...wrap.children].find(c=>c.classList.contains("tip"));if(!tip){tip=document.createElement("div");tip.className="tip";tip.setAttribute("role","tooltip");wrap.appendChild(tip)}
  tip.innerHTML=`<b>${esc(o.t)}</b>`+o.r.map(([l,v,c,cls,sep])=>`<div${sep?' class="tn"':""}><span>${c?dot(c):""}${esc(l)}</span><span class="num ${cls||""}">${esc(v)}</span></div>`).join("");
  tip.hidden=false;
  const grp=el.closest(".ttg");if(grp){grp.classList.add("hov");grp.querySelectorAll(".tt").forEach(t=>t.classList.toggle("on",t===el||(!!el.dataset.k&&t.dataset.k===el.dataset.k)))}
  const wr=wrap.getBoundingClientRect(),er=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=er.right-wr.left+8,top=er.top-wr.top;
  if(left+tw>wr.width){left=er.left-wr.left-tw-8}
  if(left<0){left=Math.max(0,Math.min(wr.width-tw,er.left-wr.left+er.width/2-tw/2));top=er.bottom-wr.top+6}
  tip.style.left=left+"px";tip.style.top=Math.max(0,top)+"px"}
function hideTT(wrap){const tip=[...wrap.children].find(c=>c.classList.contains("tip"));if(tip)tip.hidden=true;wrap.querySelectorAll(".ttg.hov").forEach(g=>g.classList.remove("hov"));if(wrap.classList.contains("ttg"))wrap.classList.remove("hov");wrap.querySelectorAll(".tt.on").forEach(t=>t.classList.remove("on"))}
document.addEventListener("pointerover",ev=>{const el=ttTarget(ev.target);if(el)showTT(el)});
document.addEventListener("pointerout",ev=>{if(ev.pointerType==="touch")return;const el=ttTarget(ev.target);if(!el)return;const to=ttTarget(ev.relatedTarget);if(to===el)return;if(!to||to.closest(".ttwrap")!==el.closest(".ttwrap"))hideTT(el.closest(".ttwrap"))});
document.addEventListener("pointerdown",ev=>{const el=ttTarget(ev.target);document.querySelectorAll(".ttwrap").forEach(w=>{if(!el||!w.contains(el))hideTT(w)})});
document.addEventListener("focusin",ev=>{const el=ttTarget(ev.target);if(el)showTT(el)});
document.addEventListener("focusout",ev=>{const el=ttTarget(ev.target);if(el&&!ttTarget(ev.relatedTarget))hideTT(el.closest(".ttwrap"))});
addEventListener("scroll",()=>document.querySelectorAll(".ttwrap").forEach(hideTT),{passive:true});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#sheetRoot").innerHTML){closeSheet();SF=null;AF=null;render()}});
addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",scrollY>4),{passive:true});
addEventListener("beforeunload",ev=>{if(dirty){ev.preventDefault();ev.returnValue=""}});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{paintTop();render()});

/* ---------- phone lifecycle ---------- */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&dirty&&!saving&&!S.demo){ls.set("tapledger.v1",JSON.stringify(S));dirty=false;if(signedIn())GA.patch({pending:true});paintTop();backupPending=true;bkSnooze=false;if(NATIVE)autoBackupNative()}});
try{localStorage.removeItem("tapledger.gsync")}catch(e){}
if(!NATIVE&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- boot ---------- */
gRedirect=NATIVE?null:gReadRedirect();
S=exampleBook();fixDash();dirty=false;mode="loading";paintTop();render();
initStore().then(gBoot).then(()=>setTimeout(()=>updCheck(false),1500));
})();
