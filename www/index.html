<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FinTrack</title>
<meta name="description" content="FinTrack - personal double-entry finance tracker">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}.amt input{font-size:32px!important}}
</style>
</head>
<body>
<style>
/* Layout: phone-width app shell, sticky top bar, fixed bottom nav with a centre "+" button; ruled ledger tables in mono figures */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eaedf3; --line:#d9dee7; --fg:#141a26; --muted:#5b6578;
  --accent:#2f4fd8; --accent-soft:#e3e8fc; --accent-fg:#ffffff;
  --pos:#127a46; --neg:#c2302a; --warn:#a86300; --pos-soft:#ddf3e7; --neg-soft:#fbe3e1; --warn-soft:#fbefd9;
  --shadow:0 10px 30px rgba(20,26,38,.14);
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151922; --surface2:#1c212c; --line:#2a303d; --fg:#e8ebf1; --muted:#97a0b1;
  --accent:#8196ff; --accent-soft:#232b4d; --accent-fg:#0d1016;
  --pos:#4fc58b; --neg:#ff7b70; --warn:#f0b452; --pos-soft:#15301f; --neg-soft:#3a1b19; --warn-soft:#3a2b12;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151922; --surface2:#1c212c; --line:#2a303d; --fg:#e8ebf1; --muted:#97a0b1;
  --accent:#8196ff; --accent-soft:#232b4d; --accent-fg:#0d1016;
  --pos:#4fc58b; --neg:#ff7b70; --warn:#f0b452; --pos-soft:#15301f; --neg-soft:#3a1b19; --warn-soft:#3a2b12;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.cur{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cur{font-size:.78em;color:var(--muted);margin-right:.15em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.shell{max-width:620px;margin:0 auto;min-height:100%;padding:0 16px 120px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-style:normal;font-family:var(--f-num);font-size:12px}
.store{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:default}
.icon{width:38px;height:38px;padding:0;justify-content:center}
.savebtn .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}
.savebtn.dirty .dot{display:block}
/* banner */
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-block:4px 14px;font-size:14px}
.banner p{margin:0;flex:1 1 220px}
/* page head */
.ph{display:flex;align-items:center;gap:10px;margin-block:8px 12px}
.ph h1{font-size:22px;margin:0;letter-spacing:-.02em;margin-right:auto;text-wrap:balance}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mnav button{border:0;background:none;width:32px;height:32px;font-size:16px;color:var(--muted)}
.mnav span{font-weight:600;font-size:14px;min-width:78px;text-align:center}
/* cards */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:13px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.lbl{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-block:7px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.chip.ok{background:var(--pos-soft);color:var(--pos)}.chip.bad{background:var(--neg-soft);color:var(--neg)}.chip.w{background:var(--warn-soft);color:var(--warn)}.chip.n{background:var(--surface2);color:var(--muted)}
.dotc{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;white-space:nowrap}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 2px 6px;display:flex;justify-content:space-between}
/* charts */
.donut{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.donut svg{width:132px;height:132px}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:5px}
.bud{padding-block:8px}
.bud .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
svg text{font-family:var(--f-num);font-size:9px;fill:var(--muted)}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* ledger tables */
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.led{width:100%;border-collapse:collapse;font-size:13.5px;min-width:440px}
table.led th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:2px solid var(--line)}
table.led td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.led td.n,table.led th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.led tr.click{cursor:pointer}
table.led tr.click:hover td{background:var(--surface2)}
table.led tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:3px double var(--line)}
table.led tr.bf td{color:var(--muted);font-style:italic}
.dt{white-space:nowrap;color:var(--muted);font-family:var(--f-num);font-size:12.5px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .fab{width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-fg);margin:-22px auto 0;padding:0;justify-content:center;box-shadow:var(--shadow);font-size:28px;font-weight:400}
.nav .fab svg{width:26px;height:26px;stroke-width:2.2}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .18s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:18px;margin-right:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.amt{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding-block:4px 6px;margin-bottom:12px}
.amt:focus-within{border-color:var(--accent)}
.amt span{font-family:var(--f-num);color:var(--muted);font-size:15px}
.amt input{border:0;background:none;font-family:var(--f-num);font-size:32px;font-weight:500;width:100%;min-width:0;outline:none}
.fl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0}
textarea.inp{min-height:110px;font-family:var(--f-num);font-size:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.preview{font-family:var(--f-num);font-size:12.5px;background:var(--surface2);border-radius:9px;padding:9px 11px;margin:12px 0;line-height:1.6}
.preview .e{color:var(--neg);font-family:var(--f-ui)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.err{color:var(--neg);font-size:13px;margin:6px 0 0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.swatches button.on{border-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.wl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:0}
.wl span{flex:1}
.sw{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:19px}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec:last-child{border-bottom:0}
.rec input{width:118px;text-align:right;font-family:var(--f-num)}
.ph{flex-wrap:wrap}
.ttwrap{position:relative}
button.store{border:0;background:none;margin:0;padding:4px 6px;border-radius:7px;font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
button.store:hover{background:var(--surface2)}
.store.warn{color:var(--warn)}.store.ok{color:var(--pos)}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.lg-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.lg-mark{width:76px;height:76px;border-radius:22px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-num);font-weight:500;font-size:30px;box-shadow:var(--shadow)}
.lg-in h1{margin:6px 0 0;font-size:30px;letter-spacing:-.02em}
.lg-sub{margin:0;color:var(--muted)}
.gbtn{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gbtn:hover{border-color:var(--accent)}
.gbtn:disabled{opacity:.6;cursor:default}
.lg-msg{min-height:20px;margin:0;font-size:14px;color:var(--muted)}
.lg-msg.err{color:var(--neg)}
.lg-points{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:9px;text-align:left;font-size:13.5px;color:var(--muted);width:100%}
.lg-points li{display:flex;gap:9px}
.lg-legal{margin:14px 0 0;font-size:13px}.lg-legal a{color:var(--muted)}
.lg-points li::before{content:"✓";color:var(--pos);font-weight:700;flex:none}
a.btn{text-decoration:none;color:inherit}a.btn.pri{color:var(--accent-fg)}
.avbtn{border:0;background:none;padding:0;border-radius:50%;cursor:pointer;flex:none;line-height:0}
.avbtn .av{width:36px;height:36px;font-size:15px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.avbtn:hover .av{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.upd{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.updnotes{margin:4px 0 8px;padding-left:20px}.updnotes li{margin:3px 0}
.acct{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.acct .t{min-width:0}.acct .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct .t small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;position:relative;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{z-index:85!important}
.toast{z-index:95!important}
.card h3 .eyebtn{border:0;background:transparent;color:var(--muted);width:28px;height:24px;border-radius:7px;display:inline-grid;place-items:center;padding:0;margin-left:2px}
.card h3 .eyebtn:hover{background:var(--surface2);color:var(--fg)}
.card h3 .eyebtn[aria-pressed="true"]{color:var(--accent)}
.masked{letter-spacing:.12em;color:var(--muted)}
.card h3 .cbtn{margin-left:auto;flex:none;width:30px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:inline-grid;place-items:center;padding:0;margin-right:-6px}
.card h3 .sp + .cbtn{margin-left:4px}
.card h3 .cbtn:hover{background:var(--surface2);color:var(--fg)}
.card.collapsed{padding-block:10px}
.card.collapsed > :not(h3){display:none!important}
.card.collapsed > h3{margin-bottom:0}
.card.collapsed > h3 .sp{display:none}
.card.collapsed > h3 .cbtn{margin-left:auto;color:var(--accent)}
.mseg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:2px;gap:2px}
.mseg button{border:0;background:none;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.mseg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linechart .tt .guide{opacity:0}
.linechart .tt.on .guide{opacity:1}
.linechart.hov .tt{opacity:1}
.linechart.hov .tt:not(.on) circle{opacity:.35}
.linechart.hov .tt.on circle{r:4.5}
.tt{cursor:pointer}
svg .tt{outline:none}
svg g.tt:focus-visible rect:first-child{stroke:var(--accent);stroke-width:1.5}
svg circle.tt:focus-visible{stroke-width:22}
.ttg.hov .tt{opacity:.35;transition:opacity .12s}
.ttg.hov .tt.on{opacity:1}
.donut .legend .tt{border-radius:6px;padding:1px 4px;margin:0 -4px}
.tip{position:absolute;z-index:15;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;pointer-events:none;min-width:180px;max-width:260px;display:flex;flex-direction:column;gap:3px}
.tip div span:last-child{white-space:nowrap}
.tip b{font-size:12px;letter-spacing:.04em}
.tip div{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tip div span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tip .tn{border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cal .d{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:62px;padding:5px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;overflow:hidden;position:relative}
.cal .d .dn{font-weight:600;font-size:12.5px;line-height:1.2}
.cal .d .v{font-family:var(--f-num);font-size:10.5px;white-space:nowrap;line-height:1.3}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const p2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const today=()=>iso(new Date());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const NF=new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const f2=n=>{const v=r2(n);return (v<0?"−":"")+NF.format(Math.abs(v))};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dShort=d=>{const [y,m,dd]=d.split("-");return (+dd)+" "+MON[+m-1]};
const dLong=d=>{const [y,m,dd]=d.split("-");return (+dd)+" "+MON[+m-1]+" "+y};
const ymLabel=k=>{const [y,m]=k.split("-");return MON[+m-1]+" "+y};
const addMonths=(k,n)=>{let [y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+p2(m)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const PAL=["#4c6ef5","#12b886","#f59f00","#e8590c","#be4bdb","#15aabf","#fa5252","#82c91e","#7950f2","#e64980","#20c997","#fd7e14","#5c7cfa","#94a3b8"];
const SIGN={asset:1,expense:1,liability:-1,income:-1,equity:-1};
const GROUPS=[
  {k:"bank",kind:"asset",label:"Bank accounts"},
  {k:"cash",kind:"asset",label:"Cash"},
  {k:"card",kind:"liability",label:"Credit cards"},
  {k:"loan",kind:"liability",label:"Loans"},
  {k:"party",kind:"asset",label:"People · receivable / payable"},
  {k:"asset",kind:"asset",label:"Other assets"},
  {k:"liab",kind:"liability",label:"Other liabilities"},
  {k:"income",kind:"income",label:"Income categories"},
  {k:"expense",kind:"expense",label:"Expense categories"},
  {k:"equity",kind:"equity",label:"Equity"}];
const GL=Object.fromEntries(GROUPS.map(g=>[g.k,g]));
const WIDGETS={hold:"Balance check & cash in hand",chqsave:"Cheque savings plan",accounts:"Account balances",spend:"Spending by category",budget:"Budget progress",trend:"Income vs expense (6 months)",parties:"Receivables & payables",upcoming:"Upcoming EMIs & cheques",recent:"Recent entries"};

/* ---------- state ---------- */
let S=null;            // the book
let U={trend:ls.get("tapledger.trend")==="line"?"line":"bar",calDay:today(),calMode:"pl",pdcOpen:null,page:"home",month:today().slice(0,7),ledTab:"accounts",ledAcc:null,ledMonth:"all",stmtMode:"month",plansTab:"sched",setTab:"accounts",dbMonth:"all",q:""};
let dirty=false, saving=false, mode="loading", DB=null, UID=null, savedMonths={}, savedSettings="";
let F=null; // entry form state

const acc=id=>S.accounts.find(a=>a.id===id);
const accName=id=>{const a=acc(id);return a?a.name:"(deleted)"};
const byGrp=g=>S.accounts.filter(a=>a.grp===g&&!a.archived);
const moneyAccs=()=>S.accounts.filter(a=>!a.archived&&["bank","cash","card"].includes(a.grp));
const liquidAccs=()=>S.accounts.filter(a=>!a.archived&&["bank","cash"].includes(a.grp));
const money=(n,cls)=>`<span class="num ${cls||""}"><span class="cur">${esc(S.currency)}</span>${f2(n)}</span>`;

function blankBook(){
  const A=[];const add=(name,grp,o={})=>{const a={id:uid(),name,kind:GL[grp].kind,grp,color:o.color||PAL[A.length%PAL.length],budget:o.budget||0,archived:false};A.push(a);return a.id};
  add("Opening balance","equity");add("Cash in hand","cash");
  ["Salary","Other income"].forEach(n=>add(n,"income"));
  ["Rent","Groceries","Dining out","Fuel & transport","Electricity & water","Mobile & internet","Health","Shopping","Family support","Entertainment","Loan interest","Bank charges"].forEach(n=>add(n,"expense"));
  return {v:1,currency:"AED",demo:false,accounts:A,entries:[],schedules:[],pdcs:[],reserve:{},checks:{},holdCheck:null,dash:Object.keys(WIDGETS).map(id=>({id,on:true}))};
}
function equityId(){let e=S.accounts.find(a=>a.grp==="equity");if(!e){e={id:uid(),name:"Opening balance",kind:"equity",grp:"equity",color:PAL[13],budget:0,archived:false};S.accounts.push(e)}return e.id}

function exampleBook(){
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const A=[];const add=(name,grp,o={})=>{const a={id:uid(),name,kind:GL[grp].kind,grp,color:o.color||PAL[A.length%PAL.length],budget:o.budget||0,archived:false};A.push(a);return a.id};
  const eq=add("Opening balance","equity",{color:PAL[13]});
  const nbd=add("Emirates NBD Current","bank",{color:PAL[0]}),sav=add("ADCB Savings","bank",{color:PAL[1]}),cash=add("Cash in hand","cash",{color:PAL[2]});
  const card=add("Credit card","card",{color:PAL[6]}),car=add("Car loan","loan",{color:PAL[4]});
  const bilal=add("Bilal","party",{color:PAL[5]}),hassan=add("Hassan","party",{color:PAL[9]});
  const sal=add("Salary","income",{color:PAL[1]}),fre=add("Freelance","income",{color:PAL[5]});add("Other income","income",{color:PAL[7]});
  const E={};[["Rent",6000],["Groceries",1500],["Dining out",600],["Fuel & transport",700],["Electricity & water",450],["Mobile & internet",350],["Health",300],["Shopping",800],["Family support",2000],["Entertainment",300],["Loan interest",0],["Insurance",0],["Bank charges",50]]
    .forEach(([n,b],i)=>E[n]=add(n,"expense",{budget:b,color:PAL[[0,1,2,3,5,8,6,9,4,7,13,10,11][i]]}));
  E["School fees"]=add("School fees","expense",{budget:0,color:PAL[12]});
  const ent=[];const je=(date,memo,lines,t)=>ent.push({id:uid(),date,memo,lines:lines.map(([a,dr,cr])=>({a,dr:r2(dr),cr:r2(cr)})),t:t||null});
  const ex=(d,cat,from,amt,memo)=>je(d,memo,[[E[cat],amt,0],[from,0,amt]],{type:"expense",cat:E[cat],from});
  je("2026-08-01","Opening balances",[[nbd,18500,0],[sav,42000,0],[cash,1250,0],[bilal,1500,0],[eq,0,63250]]);
  je("2026-08-01","Opening balance · car loan",[[eq,48000,0],[car,0,48000]]);
  const rentE={};
  for(const m of ["2026-08","2026-09","2026-10"]){
    const last=m==="2026-10"?10:28;
    ex(m+"-01","Rent",nbd,6000,"Rent · Al Nahda flat · PDC #"+String(120+["2026-08","2026-09","2026-10"].indexOf(m)).padStart(6,"0"));rentE[m]=ent[ent.length-1].id;
    je(m+"-05","Car loan EMI",[[car,1600,0],[E["Loan interest"],250,0],[nbd,0,1850]]);
    ex(m+"-06","Electricity & water",nbd,r2(380+rnd()*90),"Utility bill");
    ex(m+"-02","Family support",nbd,2000,"Sent home");
    if(m!=="2026-10")ex(m+"-12","Mobile & internet",card,349,"Mobile plan");
    for(let d=1;d<=last;d+=1){
      const ds=m+"-"+p2(d);
      if(d%3===0)ex(ds,"Groceries",rnd()<.5?cash:card,r2(60+rnd()*160),rnd()<.5?"Supermarket":"Bakala");
      if(d%7===2)ex(ds,"Fuel & transport",card,r2(90+rnd()*60),"Fuel");
      if(d%6===4)ex(ds,"Dining out",rnd()<.6?card:cash,r2(45+rnd()*120),"Dinner");
      if(d===18&&m!=="2026-10")ex(ds,"Shopping",card,r2(250+rnd()*500),"Clothes");
      if(d===21&&m!=="2026-10")ex(ds,"Entertainment",card,r2(80+rnd()*120),"Cinema");
    }
    if(m!=="2026-10"){
      je(m+"-15","Card payment",[[card,2600,0],[nbd,0,2600]],{type:"transfer",from:nbd,to:card});
      je(m+"-28","Salary",[[nbd,14000,0],[sal,0,14000]],{type:"income",to:nbd,cat:sal});
      je(m+"-29","Monthly saving",[[sav,2000,0],[nbd,0,2000]],{type:"transfer",from:nbd,to:sav});
      je(m+"-20","ATM withdrawal",[[cash,500,0],[nbd,0,500]],{type:"transfer",from:nbd,to:cash});
    }
  }
  ex("2026-09-09","Health",card,220,"Clinic visit");
  je("2026-09-18","Logo design project",[[nbd,3500,0],[fre,0,3500]],{type:"income",to:nbd,cat:fre});
  je("2026-09-24","Borrowed from Hassan",[[cash,1000,0],[hassan,0,1000]],{type:"party",pact:"recv",party:hassan,from:cash});
  je("2026-10-07","Repaid Hassan (part)",[[hassan,400,0],[cash,0,400]],{type:"party",pact:"paid",party:hassan,from:cash});
  const B={v:1,currency:"AED",demo:true,accounts:A,entries:ent,
    schedules:[
      {id:uid(),kind:"emi",name:"Car loan EMI",amount:1850,interest:250,intAcc:E["Loan interest"],dr:car,cr:nbd,freq:"monthly",next:"2026-11-05",left:26,chq:"",active:true},
      {id:uid(),kind:"bill",name:"Mobile plan",amount:349,interest:0,dr:E["Mobile & internet"],cr:card,freq:"monthly",next:"2026-10-12",left:null,chq:"",active:true},
      {id:uid(),kind:"bill",name:"Car service",amount:650,interest:0,dr:E["Fuel & transport"],cr:card,freq:"repeat",every:4,unit:"month",next:"2026-12-03",left:null,chq:"",active:true},
      {id:uid(),kind:"bill",name:"Car insurance",amount:2400,interest:0,dr:E["Insurance"],cr:nbd,freq:"yearly",next:"2027-03-15",left:null,chq:"",active:true}],
    pdcs:[
      {id:uid(),dir:"out",name:"Rent · Al Nahda flat",bank:nbd,other:E["Rent"],chqs:Array.from({length:12},(_,i)=>({id:uid(),no:String(120+i).padStart(6,"0"),date:iso(new Date(2026,7+i,1)),amount:6000,status:i<3?"cleared":"pending",eid:i<3?rentE[["2026-08","2026-09","2026-10"][i]]:null}))},
      {id:uid(),dir:"out",name:"School fees · term cheques",bank:nbd,other:E["School fees"],chqs:[["004511","2027-01-05"],["004512","2027-04-05"],["004513","2027-07-05"]].map(([no,date])=>({id:uid(),no,date,amount:4500,status:"pending",eid:null}))},
      {id:uid(),dir:"in",name:"Bilal · loan repayment",bank:nbd,other:bilal,chqs:[{id:uid(),no:"551204",date:"2026-10-20",amount:1500,status:"pending",eid:null}]}],
    checks:{},holdCheck:null,dash:Object.keys(WIDGETS).map(id=>({id,on:true}))};
  S=B;const cb=bal(cash);B.checks[cash]={actual:r2(cb-70),date:"2026-10-10"};
  return B;
}

/* ---------- double-entry engine ---------- */
function totals(filter){const m={};for(const e of S.entries){if(filter&&!filter(e))continue;for(const l of e.lines){const t=m[l.a]||(m[l.a]={dr:0,cr:0});t.dr+=+l.dr||0;t.cr+=+l.cr||0}}return m}
function bal(id,filter){const a=acc(id);if(!a)return 0;let dr=0,cr=0;for(const e of S.entries){if(filter&&!filter(e))continue;for(const l of e.lines)if(l.a===id){dr+=+l.dr||0;cr+=+l.cr||0}}return r2((dr-cr)*SIGN[a.kind])}
const inMonth=k=>e=>e.date.slice(0,7)===k;
const inYear=y=>e=>e.date.slice(0,4)===y;
const upto=d=>e=>e.date<=d;
const before=d=>e=>e.date<d;
function catSpend(k,kind){const t=totals(inMonth(k));return S.accounts.filter(a=>a.kind===kind).map(a=>({a,v:r2(((t[a.id]||{dr:0}).dr-(t[a.id]||{cr:0}).cr)*SIGN[kind])})).filter(x=>Math.abs(x.v)>0.004).sort((x,y)=>y.v-x.v)}
function sumKind(t,kind){let s=0;for(const a of S.accounts)if(a.kind===kind&&t[a.id])s+=(t[a.id].dr-t[a.id].cr)*SIGN[kind];return r2(s)}

/* ---------- persistence ---------- */
function markDirty(){dirty=true;paintTop()}
function storeLabel(){return gStatus()[0]}
function paintTop(){const b=$("#saveBtn");b.classList.toggle("dirty",dirty);b.lastChild.textContent=saving?"Saving…":"Save";b.disabled=saving;{const st=gStatus(),el=$("#store");el.textContent=st[0];el.className="store "+st[1]}
  {const b=$("#avBtn"),u=(GA.get().user)||null;if(b){b.hidden=!u;if(u){const init=esc((u.name||u.email||"?").trim().charAt(0).toUpperCase());const key=(u.picture||"")+"|"+init;
    if(b.dataset.k!==key){b.dataset.k=key;b.innerHTML=`<span class="av">${init}${u.picture?`<img class="avimg" src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`:""}</span>`}
    b.title=(u.name?u.name+" · ":"")+u.email;b.setAttribute("aria-label","Google account: "+u.email)}}}}
function settingsPayload(){const {entries,...rest}=S;return rest}
function monthsMap(){const m={};for(const e of S.entries){(m[e.date.slice(0,7)]||(m[e.date.slice(0,7)]=[])).push(e)}return m}
async function initStore(){
  let db=null,user=null;
  
  if(db&&user){try{const id=await user.id();if(id){DB=db;UID=id}}catch(e){}}
  if(DB){
    mode="cloud";
    try{
      const snap=await DB.collection("data/users/"+UID).limit(1000).get();
      let settings=null;const ents=[];
      for(const d of snap.docs){const v=d.data();if(!v)continue;if(d.id==="settings")settings=v;else if(v.type==="journal"&&Array.isArray(v.entries)){ents.push(...v.entries);savedMonths[v.m]=JSON.stringify(v.entries)}}
      if(settings){S=Object.assign(blankBook(),settings,{entries:ents});savedSettings=JSON.stringify(settingsPayload());dirty=false}
    }catch(e){toast("Could not load your saved book. Working on example data.")}
  }else{
    mode="local";
    const raw=ls.get("tapledger.v1");
    if(raw){try{S=Object.assign(blankBook(),JSON.parse(raw));dirty=false}catch(e){}}
  }
  fixDash();paintTop();render();
}
async function save(){
  if(saving)return;
  if(S.demo){S.demo=false}
  saving=true;paintTop();
  try{
    if(mode==="cloud"){
      const col=DB.collection("data/users/"+UID);
      const set=JSON.stringify(settingsPayload());
      if(set!==savedSettings){await col.doc("settings").set(settingsPayload());savedSettings=set}
      const mm=monthsMap();const keys=new Set([...Object.keys(mm),...Object.keys(savedMonths)]);
      for(const k of keys){
        const list=(mm[k]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);const js=JSON.stringify(list);
        if(js===savedMonths[k])continue;
        if(list.length){await col.doc("j_"+k).set({type:"journal",m:k,entries:list});savedMonths[k]=js}
        else{await col.doc("j_"+k).delete();delete savedMonths[k]}
      }
    }else{ls.set("tapledger.v1",JSON.stringify(S))}
    dirty=false;backupPending=true;toast("Saved on this phone");afterSave();
  }catch(e){toast("Save failed: "+(e&&e.message?e.message:"try again in a moment"))}
  saving=false;paintTop();render();
}
function fixDash(){if(!Array.isArray(S.pdcs))S.pdcs=[];if(!Array.isArray(S.schedules))S.schedules=[];S.schedules.forEach(normSched);const have=new Set(S.dash.map(d=>d.id));for(const id of Object.keys(WIDGETS))if(!have.has(id))S.dash.push({id,on:true});S.dash=S.dash.filter(d=>WIDGETS[d.id])}

/* ---------- theme ---------- */

const head=(t,extra)=>`<div class="sh-head"><h2>${t}</h2>${extra||""}<button class="btn ghost icon" data-act="close" aria-label="Close">✕</button></div>`;
const monthNav=()=>`<div class="mnav"><button data-act="mon" data-d="-1" aria-label="Previous month">‹</button><span>${ymLabel(U.month)}</span><button data-act="mon" data-d="1" aria-label="Next month">›</button></div>`;

const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
function daysLeftInMonth(k){const t=today();if(t.slice(0,7)!==k)return 0;return +lastDay(k).slice(8)-(+t.slice(8))+1}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".nav [data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===U.page));
  const m=$("#main");
  m.innerHTML=(backupDue()?`<div class="banner"><p><b>${backupPending?"Saved on this phone.":"Backup due."}</b> ${IOS?"Keep a copy in Files too, so it survives even if the app is deleted.":"Download a copy too, so it survives even if the app is deleted."}</p><button class="btn sm" data-act="bkLater">Later</button><button class="btn sm pri" data-act="xlBackup">${IOS?"Save copy to Files":"Download backup"}</button></div>`:"")+(S.demo?`<div class="banner"><p><b>Example data.</b> Play with it freely. Nothing is kept until you press Save.</p><label class="btn sm" for="xlRestore2" tabindex="0">Restore from backup</label><input type="file" id="xlRestore2" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden><button class="btn sm pri" data-act="fresh">Start with my own data</button></div>`:"")+
    ({home:pHome,ledgers:pLedgers,plans:pPlans,settings:pSettings}[U.page])();
}

/* Home */
const ICON_EYE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const ICON_EYE_OFF='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
let COL=new Set();try{COL=new Set(JSON.parse(ls.get("tapledger.collapsed")||"[]"))}catch(e){}
function saveCol(){ls.set("tapledger.collapsed",JSON.stringify([...COL]))}
const ICON_EYE_OPEN='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_SHUT='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.9M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
const hideBal=()=>ls.get("tapledger.hidebal")==="1";
function pHome(){
  const shown=S.dash.filter(d=>d.on);
  const ws=shown.map(d=>{const c=COL.has(d.id);
    const btn=`<button class="cbtn" data-act="collapse" data-w="${d.id}" aria-expanded="${!c}" aria-label="${c?"Show":"Hide"} ${esc(WIDGETS[d.id])}" title="${c?"Show card":"Hide card"}">${c?ICON_EYE_OFF:ICON_EYE}</button>`;
    return W[d.id]().replace('<section class="card','<section data-w="'+d.id+'" class="card'+(c?" collapsed":"")).replace("</h3>",btn+"</h3>")}).join("");
  const anyCol=shown.some(d=>COL.has(d.id));
  return `<div class="ph"><h1>Overview</h1>${monthNav()}</div><div class="stack">${ws||'<div class="card empty">All dashboard cards are hidden. Turn them on in Manage → Dashboard.</div>'}
  <div style="text-align:center"><button class="link" data-act="go" data-p="settings" data-t="dash">Arrange dashboard</button>${shown.length?` · <button class="link" data-act="collapseAll" data-v="${anyCol?"show":"hide"}">${anyCol?"Show all cards":"Hide all cards"}</button>`:""}</div></div>`;
}
const W={
  hold(){
    const HB=hideBal(),hm=(n,cls)=>HB?`<span class="num masked" aria-label="hidden"><span class="cur">${esc(S.currency)}</span>••••••</span>`:money(n,cls);
    const liq=r2(liquidAccs().reduce((s,a)=>s+bal(a.id),0));
    const cashA=byGrp("cash");const cashBal=r2(cashA.reduce((s,a)=>s+bal(a.id),0));
    let actual=null,checked=0;
    for(const a of liquidAccs()){const c=S.checks[a.id];if(c&&c.actual!==""&&c.actual!=null){actual=(actual||0)+ +c.actual;checked++}else{actual=(actual||0)+bal(a.id)}}
    if(S.holdCheck&&S.holdCheck.actual!=null&&S.holdCheck.actual!==""){actual=+S.holdCheck.actual;checked=1}
    const diff=checked?r2(actual-liq):null;
    const chip=diff==null?`<span class="chip n">Not checked yet</span>`:Math.abs(diff)<0.005?`<span class="chip ok">Matches</span>`:`<span class="chip ${diff<0?"bad":"w"}">${diff<0?"Missing ":"Extra "}${HB?"••••":f2(Math.abs(diff))}</span>`;
    return `<section class="card"><h3>What I hold <button class="eyebtn" data-act="hideBal" aria-pressed="${HB}" aria-label="${HB?"Show":"Hide"} balances" title="${HB?"Show":"Hide"} balances">${HB?ICON_EYE_SHUT:ICON_EYE_OPEN}</button><span class="sp"><button class="link" data-act="recon">Check balances</button></span></h3>
    <div class="hero"><div><div class="lbl">App balance · bank + cash</div><div class="big">${hm(liq)}</div></div>
    <div><div class="lbl">Cash in hand</div><div class="big">${hm(cashBal)}</div></div></div>
    <div class="kv" style="margin-top:10px"><span class="muted">My figure</span><b>${checked?hm(actual):'<span class="muted">—</span>'}</b></div>
    <div class="kv"><span class="muted">Difference</span>${chip}</div>
    ${diff&&Math.abs(diff)>=0.005?`<p class="lbl" style="margin:6px 0 0">${diff<0?"You hold less than the app shows. A spend may be unrecorded.":"You hold more than the app shows. An income or refund may be unrecorded."}</p>`:""}</section>`;
  },
  accounts(){
    const t=totals();const nw=r2(sumKind(t,"asset")-sumKind(t,"liability"));
    const rows=moneyAccs().concat(byGrp("loan")).map(a=>{const b=bal(a.id);return `<button class="row" data-act="openLed" data-id="${a.id}">${dot(a.color)}<span class="t"><b>${esc(a.name)}</b><small>${GL[a.grp].label}</small></span><span class="r">${money(a.kind==="liability"?-b:b,a.kind==="liability"&&b>0?"neg":"")}</span></button>`}).join("");
    return `<section class="card"><h3>Accounts <span class="sp">Net worth ${money(nw)}</span></h3><div class="rows">${rows||'<p class="empty">Add your bank, cash and card accounts in Manage.</p>'}</div></section>`;
  },
  spend(){
    const list=catSpend(U.month,"expense");const tot=r2(list.reduce((s,x)=>s+x.v,0));
    if(!tot)return `<section class="card"><h3>Spending · ${ymLabel(U.month)}</h3><p class="empty">No expenses recorded this month.</p></section>`;
    const R=46,C=2*Math.PI*R;let off=0;
    const cnt={};for(const e of S.entries)if(e.date.slice(0,7)===U.month)for(const l of e.lines)if(l.dr>0)cnt[l.a]=(cnt[l.a]||0)+1;
    const tip=x=>{const r=[["Spent",f2(x.v),x.a.color,""],["Share of spending",pct(x.v,tot),null,""],["Entries",String(cnt[x.a.id]||0),null,""]];
      if(x.a.budget>0){const left=r2(x.a.budget-x.v);r.push(["Budget",f2(x.a.budget),null,"",true],[left<0?"Over budget":"Left",f2(Math.abs(left)),null,left<0?"neg":"pos"])}
      return ttAttr(x.a.name+" · "+ymLabel(U.month),r)};
    const segs=list.filter(x=>x.v>0).map(x=>{const len=x.v/tot*C;const s=`<circle class="tt" data-k="${x.a.id}" tabindex="0" aria-label="${esc(x.a.name)} ${f2(x.v)}"${tip(x)} r="${R}" cx="60" cy="60" fill="none" stroke="${x.a.color}" stroke-width="18" stroke-dasharray="${Math.max(len-1,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join("");
    const inc=catSpend(U.month,"income").reduce((s,x)=>s+x.v,0);
    const leg=list.slice(0,7).map(x=>`<div class="tt" data-k="${x.a.id}"${tip(x)}>${dot(x.a.color)}<span class="n">${esc(x.a.name)}</span><span class="num">${f2(x.v)}</span><span class="muted num" style="width:38px;text-align:right">${Math.round(x.v/tot*100)}%</span></div>`).join("")+(list.length>7?`<div class="muted" style="font-size:12.5px">+${list.length-7} more · hover the ring</div>`:"");
    return `<section class="card"><h3>Spending · ${ymLabel(U.month)}<span class="sp">Income ${money(inc,"pos")}</span></h3><div class="donut ttg ttwrap"><svg viewBox="0 0 120 120" role="img" aria-label="Spending by category"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--surface2)" stroke-width="18"/>${segs}<text x="60" y="56" text-anchor="middle" style="font-size:8px">SPENT</text><text x="60" y="70" text-anchor="middle" style="font-size:11.5px;fill:var(--fg);font-weight:500">${f2(tot)}</text></svg><div class="legend">${leg}</div></div></section>`;
  },
  budget(){
    const cats=S.accounts.filter(a=>a.kind==="expense"&&!a.archived&&a.budget>0);
    if(!cats.length)return `<section class="card"><h3>Budget · ${ymLabel(U.month)}</h3><p class="empty">Set monthly budgets in Plans → Budgets.</p></section>`;
    const t=totals(inMonth(U.month));let tb=0,ts=0;
    const rows=cats.map(a=>{const s=r2(((t[a.id]||{dr:0}).dr-(t[a.id]||{cr:0}).cr));tb+=a.budget;ts+=s;const pct=s/a.budget;const col=pct>1?"var(--neg)":pct>.85?"var(--warn)":a.color;
      return `<div class="bud tt" tabindex="0" data-k="${a.id}"${budTip(a,s)}><div class="top2"><span>${esc(a.name)}</span><span class="num ${pct>1?"neg":""}">${f2(s)} <span class="muted">/ ${f2(a.budget)}</span></span></div><div class="bar"><i style="width:${Math.min(pct*100,100)}%;background:${col}"></i></div></div>`}).join("");
    return `<section class="card ttg ttwrap"><h3>Budget · ${ymLabel(U.month)}<span class="sp">${money(r2(tb-ts),tb-ts<0?"neg":"")} left</span></h3>${rows}</section>`;
  },
  trend(){
    const ks=[];for(let i=5;i>=0;i--)ks.push(addMonths(U.month,-i));
    const data=ks.map(k=>{const t=totals(inMonth(k));return {k,inc:sumKind(t,"income"),exp:sumKind(t,"expense")}});
    const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
    const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=Math.ceil(max/p);const st=[1,2,2.5,5,10].find(s=>s>=m)||10;return st*p})();
    const W0=320,H=150,L=40,B=20,T=8,cw=(W0-L-4)/6;const y=v=>T+(H-T-B)*(1-v/nice);
    let g="";[0,.5,1].forEach(f=>{const v=nice*f;g+=`<line x1="${L}" x2="${W0-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`});
    const bars=data.map((d,i)=>{const x=L+i*cw+cw*.18;const bw=cw*.3;const net=r2(d.inc-d.exp);return `<g class="tt" data-k="${d.k}" tabindex="0" aria-label="${ymLabel(d.k)}: income ${f2(d.inc)}, expense ${f2(d.exp)}"${ttAttr(ymLabel(d.k),[["Income",f2(d.inc),"var(--pos)",""],["Expense",f2(d.exp),"var(--neg)",""],["Net",f2(net),null,net<0?"neg":"pos",true],["Saved",d.inc>0?pct(net,d.inc)+" of income":"—",null,""]])}><rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}" fill="transparent"/><rect x="${x}" y="${y(d.inc)}" width="${bw}" height="${(H-B)-y(d.inc)}" rx="2" fill="var(--pos)"/><rect x="${x+bw+2}" y="${y(d.exp)}" width="${bw}" height="${(H-B)-y(d.exp)}" rx="2" fill="var(--neg)"/><text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle" ${d.k===U.month?'style="fill:var(--fg)"':""}>${MON[+d.k.slice(5)-1]}</text></g>`}).join("");
    const cur=data[5];const net=r2(cur.inc-cur.exp);const lineMode=U.trend==="line";
    let lines="";
    if(lineMode){
      const px=i=>(L+i*cw+cw/2).toFixed(1);
      const path=key=>data.map((d,i)=>(i?"L":"M")+px(i)+" "+y(d[key]).toFixed(1)).join(" ");
      const area=key=>path(key)+` L${px(5)} ${H-B} L${px(0)} ${H-B} Z`;
      lines=`<path d="${area("inc")}" fill="var(--pos)" opacity=".10"/><path d="${area("exp")}" fill="var(--neg)" opacity=".07"/>`+
        `<path d="${path("inc")}" fill="none" stroke="var(--pos)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="${path("exp")}" fill="none" stroke="var(--neg)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`+
        data.map((d,i)=>{const n=r2(d.inc-d.exp),last=i===5;return `<g class="tt" data-k="${d.k}" tabindex="0" aria-label="${ymLabel(d.k)}: income ${f2(d.inc)}, expense ${f2(d.exp)}"${ttAttr(ymLabel(d.k),[["Income",f2(d.inc),"var(--pos)",""],["Expense",f2(d.exp),"var(--neg)",""],["Net",f2(n),null,n<0?"neg":"pos",true],["Saved",d.inc>0?pct(n,d.inc)+" of income":"—",null,""]])}><rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}" fill="transparent"/><line class="guide" x1="${px(i)}" x2="${px(i)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/><circle cx="${px(i)}" cy="${y(d.inc).toFixed(1)}" r="${last?3.6:2.6}" fill="var(--pos)" stroke="var(--surface)" stroke-width="1.5"/><circle cx="${px(i)}" cy="${y(d.exp).toFixed(1)}" r="${last?3.6:2.6}" fill="var(--neg)" stroke="var(--surface)" stroke-width="1.5"/><text x="${px(i)}" y="${H-6}" text-anchor="middle" ${d.k===U.month?'style="fill:var(--fg)"':""}>${MON[+d.k.slice(5)-1]}</text></g>`}).join("");
    }
    const sw=`<span class="mseg" role="group" aria-label="Chart type"><button class="${!lineMode?"on":""}" data-act="trendMode" data-t="bar" aria-pressed="${!lineMode}">Bars</button><button class="${lineMode?"on":""}" data-act="trendMode" data-t="line" aria-pressed="${lineMode}">Lines</button></span>`;
    return `<section class="card"><h3>Income vs expense<span class="sp">${sw}</span></h3><div class="ttwrap"><svg class="ttg${lineMode?" linechart":""}" viewBox="0 0 ${W0} ${H}" style="width:100%;height:auto" aria-label="Income and expense for six months, ${lineMode?"line":"bar"} chart">${g}${lineMode?lines:bars}</svg></div><div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;align-items:center"><div>${dot("var(--pos)")}Income</div><div>${dot("var(--neg)")}Expense</div><div style="margin-left:auto">${ymLabel(U.month)} net ${money(net,net<0?"neg":"pos")}</div></div></section>`;
  },
  parties(){
    const ps=S.accounts.filter(a=>a.grp==="party"&&!a.archived).map(a=>({a,b:bal(a.id)})).filter(x=>Math.abs(x.b)>0.004);
    const rec=r2(ps.filter(x=>x.b>0).reduce((s,x)=>s+x.b,0)),pay=r2(-ps.filter(x=>x.b<0).reduce((s,x)=>s+x.b,0));
    const rows=ps.map(x=>`<button class="row" data-act="openLed" data-id="${x.a.id}">${dot(x.a.color)}<span class="t"><b>${esc(x.a.name)}</b><small>${x.b>0?"Owes you":"You owe"}</small></span><span class="r">${money(Math.abs(x.b),x.b>0?"pos":"neg")}</span></button>`).join("");
    return `<section class="card"><h3>Receivables & payables</h3><div class="hero"><div><div class="lbl">To receive</div><div class="big pos">${money(rec)}</div></div><div><div class="lbl">To pay</div><div class="big neg">${money(pay)}</div></div></div><div class="rows" style="margin-top:6px">${rows||'<p class="empty">Nobody owes anything right now.</p>'}</div></section>`;
  },
  chqsave(){return chequePlanCard(false)},
  upcoming(){
    const lim=addDays(today(),45);
    const list=S.schedules.filter(s=>s.active&&s.next<=lim).map(s=>({d:s.next,h:schedRow(s)})).concat(S.pdcs.flatMap(p=>p.chqs.filter(c=>c.status==="pending"&&c.date<=lim).map(c=>({d:c.date,h:chqRow(p,c)})))).sort((a,b)=>a.d<b.d?-1:1).slice(0,7).map(x=>x.h);
    return `<section class="card"><h3>Upcoming · next 45 days<span class="sp"><button class="link" data-act="go" data-p="plans">All plans</button></span></h3><div class="rows">${list.join("")||'<p class="empty">Nothing due in the next 45 days.</p>'}</div></section>`;
  },
  recent(){
    const list=S.entries.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,6);
    return `<section class="card"><h3>Recent entries<span class="sp"><button class="link" data-act="go" data-p="ledgers" data-t="daybook">Day book</button></span></h3><div class="rows">${list.map(entryRow).join("")||'<p class="empty">Tap + to record your first entry.</p>'}</div></section>`;
  }
};
function budTip(a,s){const left=r2(a.budget-s),dl=daysLeftInMonth(U.month);
  const r=[["Spent",f2(s),a.color,""],["Budget",f2(a.budget),null,""],["Used",pct(s,a.budget),null,s>a.budget?"neg":""],[left<0?"Over budget":"Left",f2(Math.abs(left)),null,left<0?"neg":"pos",true]];
  if(dl&&left>0)r.push(["Per day for "+dl+" day"+(dl>1?"s":"")+" left",f2(left/dl),null,""]);
  return ttAttr(a.name+" · "+ymLabel(U.month),r)}
function entryHead(e){
  const drs=e.lines.filter(l=>l.dr>0),crs=e.lines.filter(l=>l.cr>0);
  const amt=r2(drs.reduce((s,l)=>s+l.dr,0));
  const exp=e.lines.some(l=>l.dr>0&&acc(l.a)&&acc(l.a).kind==="expense");
  const inc=e.lines.some(l=>l.cr>0&&acc(l.a)&&acc(l.a).kind==="income");
  return {amt,cls:exp&&!inc?"neg":inc&&!exp?"pos":"",sub:drs.map(l=>accName(l.a)).join(", ")+" ← "+crs.map(l=>accName(l.a)).join(", ")};
}
function entryRow(e){const h=entryHead(e);return `<button class="row" data-act="editEntry" data-id="${e.id}"><span class="dt" style="width:46px">${dShort(e.date)}</span><span class="t"><b>${esc(e.memo||h.sub)}</b><small>${esc(h.sub)}</small></span><span class="r">${money(h.amt,h.cls)}</span></button>`}
const KIND={emi:"EMI",chqout:"Cheque out",chqin:"Cheque in",bill:"Bill",inc:"Income"};
function schedRow(s){
  const d=daysBetween(today(),s.next);const st=d<0?`<span class="chip bad">${-d}d overdue</span>`:d===0?`<span class="chip w">Due today</span>`:d<=7?`<span class="chip w">In ${d}d</span>`:`<span class="chip n">${dShort(s.next)}</span>`;
  return `<div class="row"><span class="t"><b>${esc(s.name)}</b><small>${KIND[s.kind]}${s.chq?" · #"+esc(s.chq):""} · ${freqLabel(s)}${s.left!=null&&s.left!==""?" · "+s.left+" left":""}</small></span><span class="r">${money(s.amount,s.kind==="chqin"||s.kind==="inc"?"pos":"")}<br>${st}</span><button class="btn sm" data-act="postSched" data-id="${s.id}" title="Record this payment">Post</button></div>`;
}

/* Ledgers */
function pLedgers(){
  if(U.ledAcc&&acc(U.ledAcc))return pAccountLedger(acc(U.ledAcc));
  const tabs=[["accounts","Accounts"],["daybook","Day book"],["trial","Trial balance"],["stmt","Statements"]];
  return `<div class="ph"><h1>Ledgers</h1><button class="btn sm" data-act="dlStmt">Download statement</button></div><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="${U.ledTab===k?"on":""}" data-act="ledTab" data-t="${k}">${l}</button>`).join("")}</div>`+({accounts:lAccounts,daybook:lDaybook,trial:lTrial,stmt:lStmt}[U.ledTab])();
}
function lAccounts(){
  return GROUPS.map(g=>{const list=S.accounts.filter(a=>a.grp===g.k&&!a.archived);if(!list.length)return"";
    const sum=r2(list.reduce((s,a)=>s+bal(a.id),0));
    return `<div class="grp"><span>${g.label}</span><span class="num">${f2(sum)}</span></div><div class="card" style="padding-block:2px"><div class="rows">${list.map(a=>{const b=bal(a.id);return `<button class="row" data-act="openLed" data-id="${a.id}">${dot(a.color)}<span class="t"><b>${esc(a.name)}</b>${a.grp==="party"&&Math.abs(b)>0.004?`<small>${b>0?"Owes you":"You owe"}</small>`:""}</span><span class="r">${money(b,b<0?"neg":"")}</span><span class="muted">›</span></button>`}).join("")}</div></div>`}).join("");
}
function monthOptions(sel){const ks=[...new Set(S.entries.map(e=>e.date.slice(0,7)))].sort().reverse();return `<option value="all"${sel==="all"?" selected":""}>All dates</option>`+ks.map(k=>`<option value="${k}"${sel===k?" selected":""}>${ymLabel(k)}</option>`).join("")}
function pAccountLedger(a){
  const k=U.ledMonth;const list=S.entries.filter(e=>e.lines.some(l=>l.a===a.id)&&(k==="all"||e.date.slice(0,7)===k)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  let run=k==="all"?0:bal(a.id,before(k+"-01"));const sg=SIGN[a.kind];let tdr=0,tcr=0;
  const rows=list.map(e=>{let dr=0,cr=0;for(const l of e.lines)if(l.a===a.id){dr+=+l.dr||0;cr+=+l.cr||0}tdr+=dr;tcr+=cr;run=r2(run+(dr-cr)*sg);
    const other=e.lines.filter(l=>l.a!==a.id).map(l=>accName(l.a)).join(", ");
    return `<tr class="click" data-act="editEntry" data-id="${e.id}"><td class="dt">${dShort(e.date)}</td><td>${esc(other)}${e.memo?`<div class="muted" style="font-size:12px">${esc(e.memo)}</div>`:""}</td><td class="n">${dr?f2(dr):""}</td><td class="n">${cr?f2(cr):""}</td><td class="n ${run<0?"neg":""}">${f2(run)}</td></tr>`}).reverse().join("");
  const bf=k==="all"?"":`<tr class="bf"><td class="dt">1 ${MON[+k.slice(5)-1]}</td><td>Balance brought forward</td><td class="n"></td><td class="n"></td><td class="n">${f2(bal(a.id,before(k+"-01")))}</td></tr>`;
  const b=bal(a.id);
  const note=a.grp==="party"?(b>0?"Owes you":b<0?"You owe":"Settled"):GL[a.grp].label;
  return `<div class="ph"><button class="btn sm" data-act="ledBack">‹ Back</button><h1 style="margin-left:4px">${esc(a.name)}</h1><button class="btn sm" data-act="dlStmt" data-id="${a.id}">Excel ↓</button></div>
  <div class="card"><div class="hero"><div><div class="lbl">Balance today · ${esc(note)}</div><div class="big ${b<0?"neg":""}">${money(b)}</div></div>

function lTrial(){

function lStmt(){
  const isY=U.stmtMode==="year";const per=isY?U.month.slice(0,4):U.month;const flt=isY?inYear(per):inMonth(per);const t=totals(flt);
  const line=(a,v)=>`<tr class="click" data-act="openLed" data-id="${a.id}"><td>${esc(a.name)}</td><td class="n">${f2(v)}</td></tr>`;
  const inc=S.accounts.filter(a=>a.kind==="income").map(a=>[a,t[a.id]?r2(t[a.id].cr-t[a.id].dr):0]).filter(x=>x[1]);
  const exp=S.accounts.filter(a=>a.kind==="expense").map(a=>[a,t[a.id]?r2(t[a.id].dr-t[a.id].cr):0]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const ti=r2(inc.reduce((s,x)=>s+x[1],0)),te=r2(exp.reduce((s,x)=>s+x[1],0)),net=r2(ti-te);
  const endD=isY?per+"-12-31":per+"-31";const tb=totals(upto(endD));
  const bl=a=>tb[a.id]?r2((tb[a.id].dr-tb[a.id].cr)*SIGN[a.kind]):0;
  const assets=S.accounts.filter(a=>a.kind==="asset").map(a=>[a,bl(a)]).filter(x=>x[1]>0.004||(x[1]<-0.004&&x[0].grp!=="party"));
  const liabs=S.accounts.filter(a=>a.kind==="liability").map(a=>[a,bl(a)]).filter(x=>Math.abs(x[1])>0.004).concat(S.accounts.filter(a=>a.grp==="party").map(a=>[a,-bl(a)]).filter(x=>x[1]>0.004));
  const eqs=S.accounts.filter(a=>a.kind==="equity").map(a=>[a,bl(a)]).filter(x=>Math.abs(x[1])>0.004);
  const ret=r2(sumKind(tb,"income")-sumKind(tb,"expense"));
  const TA=r2(assets.reduce((s,x)=>s+x[1],0)),TL=r2(liabs.reduce((s,x)=>s+x[1],0)),TE=r2(eqs.reduce((s,x)=>s+x[1],0)+ret);
  return `<div class="ph" style="margin-top:0"><div class="tabs" style="margin:0;flex:0 0 auto"><button class="${!isY?"on":""}" data-act="stmtMode" data-t="month">Month</button><button class="${isY?"on":""}" data-act="stmtMode" data-t="year">Year</button></div><span style="margin-left:auto"></span>${isY?`<div class="mnav"><button data-act="mon" data-d="-12" aria-label="Previous year">‹</button><span>${per}</span><button data-act="mon" data-d="12" aria-label="Next year">›</button></div>`:monthNav()}</div>
  <div class="stack"><div class="card"><h3>Income statement · ${isY?per:ymLabel(per)}</h3><div class="tw"><table class="led" style="min-width:0"><tbody>
  <tr><td colspan="2" class="muted" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase">Income</td></tr>${inc.map(x=>line(...x)).join("")||'<tr><td class="muted">None</td><td></td></tr>'}<tr class="tot"><td>Total income</td><td class="n pos">${f2(ti)}</td></tr>
  <tr><td colspan="2" class="muted" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding-top:14px">Expenses</td></tr>${exp.map(x=>line(...x)).join("")||'<tr><td class="muted">None</td><td></td></tr>'}<tr class="tot"><td>Total expenses</td><td class="n neg">${f2(te)}</td></tr>
  <tr class="tot"><td>${net>=0?"Surplus (saved)":"Deficit (overspent)"}</td><td class="n ${net<0?"neg":"pos"}">${f2(net)}</td></tr></tbody></table></div></div>
  <div class="card"><h3>Balance sheet · as of ${dLong(endD.endsWith("-31")&&!isY?lastDay(per):endD)}<span class="sp">${Math.abs(TA-TL-TE)<0.01?'<span class="chip ok">Balanced</span>':'<span class="chip bad">Off</span>'}</span></h3><div class="tw"><table class="led" style="min-width:0"><tbody>
  <tr><td colspan="2" class="muted" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase">Assets</td></tr>${assets.map(x=>line(...x)).join("")}<tr class="tot"><td>Total assets</td><td class="n">${f2(TA)}</td></tr>
  <tr><td colspan="2" class="muted" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding-top:14px">Liabilities</td></tr>${liabs.map(x=>line(...x)).join("")||'<tr><td class="muted">None</td><td></td></tr>'}<tr class="tot"><td>Total liabilities</td><td class="n">${f2(TL)}</td></tr>
  <tr><td colspan="2" class="muted" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding-top:14px">Equity</td></tr>${eqs.map(x=>line(...x)).join("")}<tr><td>Accumulated surplus</td><td class="n">${f2(ret)}</td></tr><tr class="tot"><td>Liabilities + equity</td><td class="n">${f2(TL+TE)}</td></tr></tbody></table></div></div></div>`;
}

/* ---------- entry form ---------- */
const TYPES=[["expense","Expense"],["income","Income"],["transfer","Transfer"],["party","Person"],["journal","Journal"]];
const PACT=[["paid","I paid / lent them"],["recv","They paid / lent me"],["owe","I owe them (bill)"],["owed","They owe me (invoice)"]];
function newForm(type){const m=moneyAccs();const cash=byGrp("cash")[0];return {type:type||"expense",amount:"",date:today(),memo:"",cat:null,from:(cash||m[0]||{}).id||null,to:(byGrp("bank")[0]||m[0]||{}).id||null,party:null,pact:"paid",newParty:"",lines:[{a:"",dr:"",cr:""},{a:"",dr:"",cr:""}],editId:null,err:""}}
function chipList(list,field,sel){return `<div class="chips">${list.map(a=>`<button type="button" class="${sel===a.id?"on":""}" data-act="fpick" data-f="${field}" data-id="${a.id}">${dot(a.color)}${esc(a.name)}</button>`).join("")}</div>`}
function formLines(){
  const a=r2(F.amount);const L=[];
  const cat=F.cat,from=F.from,to=F.to,party=F.party==="__new"?"__new":F.party;
  switch(F.type){
    case"expense":L.push([cat,a,0],[from,0,a]);break;
    case"income":L.push([to,a,0],[cat,0,a]);break;
    case"transfer":L.push([to,a,0],[from,0,a]);break;
    case"party":
      if(F.pact==="paid")L.push([party,a,0],[from,0,a]);
      else if(F.pact==="recv")L.push([from,a,0],[party,0,a]);
      else if(F.pact==="owe")L.push([cat,a,0],[party,0,a]);
      else L.push([party,a,0],[cat,0,a]);break;
    case"journal":return F.lines.filter(l=>l.a&&(+l.dr||+l.cr)).map(l=>({a:l.a,dr:r2(l.dr),cr:r2(l.cr)}));
  }
  return L.map(([x,dr,cr])=>({a:x,dr,cr}));
}
function validate(lines){
  if(F.type!=="journal"&&!(r2(F.amount)>0))return"Enter an amount above zero.";
  if(!F.date)return"Pick a date.";
  if(lines.length<2)return"A journal entry needs at least two lines.";
  if(lines.some(l=>!l.a))return F.type==="expense"||F.type==="income"?"Pick a category and an account.":F.type==="party"?"Pick a person, and a category or account.":"Pick both accounts.";
  if(F.type==="party"&&F.party==="__new"&&!F.newParty.trim())return"Type the new person's name.";
  if(F.type!=="journal"&&lines[0].a===lines[1].a)return"The two sides must be different accounts.";
  const d=r2(lines.reduce((s,l)=>s+l.dr,0)),c=r2(lines.reduce((s,l)=>s+l.cr,0));
  if(d<=0)return"Enter at least one amount.";
  if(Math.abs(d-c)>0.004)return`Debits (${f2(d)}) and credits (${f2(c)}) must be equal.`;
  return"";
}
function renderForm(){
  const exp=S.accounts.filter(a=>a.kind==="expense"&&!a.archived),inc=S.accounts.filter(a=>a.kind==="income"&&!a.archived),mon=moneyAccs(),parties=byGrp("party");
  let body="";
  if(F.type==="expense")body=`<div class="fl">Category</div>${chipList(exp,"cat",F.cat)}<div class="fl">Paid from</div>${chipList(mon,"from",F.from)}`;
  else if(F.type==="income")body=`<div class="fl">Income type</div>${chipList(inc,"cat",F.cat)}<div class="fl">Received in</div>${chipList(mon,"to",F.to)}`;
  else if(F.type==="transfer")body=`<div class="fl">From</div>${chipList(mon.concat(byGrp("loan")),"from",F.from)}<div class="fl">To</div>${chipList(mon.concat(byGrp("loan")),"to",F.to)}`;
  else if(F.type==="party"){
    body=`<div class="fl">What happened</div><div class="chips">${PACT.map(([k,l])=>`<button type="button" class="${F.pact===k?"on":""}" data-act="fpact" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="fl">Person</div><div class="chips">${parties.map(a=>`<button type="button" class="${F.party===a.id?"on":""}" data-act="fpick" data-f="party" data-id="${a.id}">${esc(a.name)}</button>`).join("")}<button type="button" class="${F.party==="__new"?"on":""}" data-act="fpick" data-f="party" data-id="__new">+ New person</button></div>
    ${F.party==="__new"?`<input class="inp" style="margin-top:8px" id="f-newParty" data-f="newParty" placeholder="Name" value="${esc(F.newParty)}">`:""}

/* ---------- schedules ---------- */
function stepDate(d,every,unit,aday){const [y,m,dd]=d.split("-").map(Number);every=Math.max(1,parseInt(every,10)||1);
  if(unit==="day")return iso(new Date(y,m-1,dd+every));if(unit==="week")return iso(new Date(y,m-1,dd+7*every));
  const want=aday||dd,tm=m-1+(unit==="year"?12*every:every);return iso(new Date(y,tm,Math.min(want,new Date(y,tm+1,0).getDate())))}
function normSched(s){if(!s.unit){const M={monthly:[1,"month"],quarterly:[3,"month"],yearly:[1,"year"]}[s.freq];s.every=M?M[0]:1;s.unit=M?M[1]:"month";s.freq=s.freq==="once"?"once":"repeat"}return s}
function freqLabel(s){if(s.freq==="once")return"one time";const e=+s.every||1,u=s.unit||"month";if(e===1)return{day:"daily",week:"weekly",month:"monthly",year:"yearly"}[u];if(u==="month"&&e===3)return"quarterly";return"every "+e+" "+u+"s"}
const REPS=[["once","One time"],["w1","Every week"],["w2","Every 2 weeks"],["m1","Every month"],["m2","Every 2 months"],["m3","Every 3 months"],["m4","Every 4 months"],["m6","Every 6 months"],["y1","Every year"],["custom","Custom…"]];
function repKey(s){if(s._custom)return"custom";if(s.freq==="once")return"once";const k=({week:"w",month:"m",year:"y"}[s.unit]||"d")+(parseInt(s.every,10)||1);return REPS.some(r=>r[0]===k)?k:"custom"}
function applyRep(o,v){o._custom=v==="custom";if(v==="once"){o.freq="once";return}o.freq="repeat";if(v==="custom"){o.every=o.every||1;o.unit=o.unit||"month";return}o.unit={w:"week",m:"month",y:"year"}[v[0]];o.every=+v.slice(1)}
const addDays=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);return iso(new Date(y,m-1,dd+n))};
function dueItems(from,to){const out=[];
  for(const s of S.schedules){if(!s.active)continue;let d=s.next,left=s.left==null||s.left===""?Infinity:+s.left,i=0;
    while(d&&d<=to&&left>0&&i<400){if(d>=from)out.push({date:d,name:s.name,amount:r2(s.amount),inflow:s.kind==="chqin"||s.kind==="inc",src:"s"});if(s.freq==="once")break;d=stepDate(d,s.every,s.unit,s.aday);left--;i++}}
  for(const p of S.pdcs)for(const c of p.chqs)if(c.status==="pending"&&c.date>=from&&c.date<=to)out.push({date:c.date,name:p.name+" · #"+c.no,amount:r2(c.amount),inflow:p.dir==="in",src:"p"});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function postSched(id,skip){
  const s=S.schedules.find(x=>x.id===id);if(!s)return;
  if(!skip){const lines=[];const princ=r2(s.amount-(+s.interest||0));
    if(s.kind==="emi"&&+s.interest>0){lines.push({a:s.dr,dr:princ,cr:0},{a:s.intAcc,dr:r2(s.interest),cr:0},{a:s.cr,dr:0,cr:r2(s.amount)})}
    else lines.push({a:s.dr,dr:r2(s.amount),cr:0},{a:s.cr,dr:0,cr:r2(s.amount)});
    if(lines.some(l=>!acc(l.a))){toast("This plan points to a deleted account. Edit it first.");return}
    S.entries.push({id:uid(),date:s.next,memo:s.name+(s.chq?" · chq #"+s.chq:""),lines,t:null});}
  if(s.left!=null&&s.left!==""){s.left=Math.max(0,(+s.left)-1);if(s.left===0)s.active=false}
  if(s.freq==="once")s.active=false;else s.next=stepDate(s.next,s.every,s.unit,s.aday);
  if(s.chq&&/^\d+$/.test(s.chq)&&s.kind!=="chqin")s.chq=String(+s.chq+1).padStart(s.chq.length,"0");
  markDirty();render();toast(skip?"Skipped to the next date.":"Posted to the ledger.");
}
let SF=null;
function editSched(id){
  const s=id?S.schedules.find(x=>x.id===id):null;
  SF=s?normSched({...s}):{id:null,kind:"emi",name:"",amount:"",interest:"",intAcc:(S.accounts.find(a=>a.name==="Loan interest")||{}).id||"",dr:"",cr:(byGrp("bank")[0]||{}).id||"",freq:"repeat",every:1,unit:"month",next:today(),left:"",chq:"",active:true};

}

  <div class="field"><label for="s-next">Next due date</label><input class="inp" type="date" id="s-next" data-s="next" value="${esc(s.next)}"></div></div>

  <div class="grid2" style="margin-top:10px"><div class="field"><label for="s-left">Payments left (blank = ongoing)</label><input class="inp num" id="s-left" inputmode="numeric" data-s="left" value="${s.left==null?"":esc(s.left)}"></div>
  ${s.kind.startsWith("chq")?`<div class="field"><label for="s-chq">Cheque number</label><input class="inp num" id="s-chq" data-s="chq" value="${esc(s.chq)}"></div>`:"<div></div>"}</div>
  ${SF.err?`<p class="err" role="alert">${esc(SF.err)}</p>`:""}
  <div class="acts" style="margin-top:14px">${s.id?`<button type="button" class="btn danger" data-act="delSched" id="delSchedBtn">Delete</button>${s.active?`<button type="button" class="btn" data-act="skipSched">Skip once</button>`:""}<span style="flex:1"></span>`:""}<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn pri">Save plan</button></div></form>`);
}
function submitSched(){
  const s=SF;s.amount=r2(s.amount);s.interest=r2(s.interest);
  if(!s.name.trim())s.err="Give the plan a name.";else if(!(s.amount>0))s.err="Enter an amount above zero.";else if(!s.dr||!s.cr)s.err="Choose both accounts.";else if(s.kind==="emi"&&s.interest>0&&!s.intAcc)s.err="Choose the interest category.";else if(s.interest>=s.amount&&s.kind==="emi")s.err="Interest must be less than the EMI.";else if(!s.next)s.err="Pick the next due date.";else if(s.freq!=="once"&&!(parseInt(s.every,10)>=1))s.err="Repeat every must be 1 or more.";else s.err="";

  if(s.left===0)s.active=false;else if(s.left>0)s.active=true;
  if(s.id){const i=S.schedules.findIndex(x=>x.id===s.id);S.schedules[i]=s}else{s.id=uid();S.schedules.push(s)}

/* ---------- PDCs (post-dated cheques) ---------- */
function accOpts(sel,filter){return `<option value="">Choose…</option>`+GROUPS.map(g=>{const l=S.accounts.filter(a=>a.grp===g.k&&!a.archived&&filter(a));return l.length?`<optgroup label="${g.label}">${l.map(a=>`<option value="${a.id}"${sel===a.id?" selected":""}>${esc(a.name)}</option>`).join("")}</optgroup>`:""}).join("")}
const nextNo=(no,i)=>/^\d+$/.test(no)?String(+no+i).padStart(no.length,"0"):(no?no+"-"+(i+1):"");
function chqChip(c){const d=daysBetween(today(),c.date);if(c.status==="cleared")return'<span class="chip ok">Cleared</span>';if(c.status==="bounced")return'<span class="chip bad">Bounced</span>';if(c.status==="cancelled")return'<span class="chip n">Cancelled</span>';
  return d<0?`<span class="chip bad">${-d}d overdue</span>`:d===0?`<span class="chip w">Due today</span>`:d<=7?`<span class="chip w">In ${d}d</span>`:`<span class="chip n">Pending</span>`}

}
function postChq(p,c){const amt=r2(c.amount);if(!acc(p.bank)||!acc(p.other)||!(amt>0))return null;
  const lines=p.dir==="out"?[{a:p.other,dr:amt,cr:0},{a:p.bank,dr:0,cr:amt}]:[{a:p.bank,dr:amt,cr:0},{a:p.other,dr:0,cr:amt}];
  const e={id:uid(),date:c.date,memo:p.name+" · PDC #"+(c.no||"—"),lines,t:null};S.entries.push(e);return e.id}
const dropEntry=id=>{if(id)S.entries=S.entries.filter(e=>e.id!==id)};
function chqAct(pid,cid,what){const p=S.pdcs.find(x=>x.id===pid);const c=p&&p.chqs.find(x=>x.id===cid);if(!c)return;
  if(what==="clear"){const id=postChq(p,c);if(!id){toast("This cheque set points to a deleted account. Edit it first.");return}c.eid=id;c.status="cleared";toast(p.dir==="out"?"Cleared. Posted to the bank ledger.":"Cleared. Bank credited.")}
  else if(what==="bounce"){dropEntry(c.eid);c.eid=null;c.status="bounced";toast("Marked as bounced.")}
  else{dropEntry(c.eid);c.eid=null;c.status="pending";toast("Back to pending.")}
  markDirty();render()}
/* ---------- cheque savings plan ---------- */
function monthDiff(a,b){const [ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return (by*12+bm)-(ay*12+am)}
function chequePlan(){
  const cm=today().slice(0,7),series=[];
  for(const p of S.pdcs){if(p.dir!=="out")continue;const next=p.chqs.filter(c=>c.status==="pending").sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0)[0];
    if(next)series.push({name:p.name,no:next.no,date:next.date,amount:r2(next.amount),bank:p.bank})}
  for(const sc of S.schedules)if(sc.active&&sc.kind==="chqout"&&sc.next)series.push({name:sc.name,no:sc.chq||"",date:sc.next,amount:r2(sc.amount),bank:sc.cr});
  for(const it of series){it.shares=Math.max(1,monthDiff(cm,it.date.slice(0,7)));it.monthly=r2(it.amount/it.shares);it.days=daysBetween(today(),it.date)}
  series.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  const banks={};for(const it of series)if(acc(it.bank))(banks[it.bank]||(banks[it.bank]=[])).push(it);
  return Object.entries(banks).map(([bank,list])=>{const balance=bal(bank),excl=r2((S.reserve||{})[bank]||0),avail=r2(balance-excl),target=r2(list.reduce((t,x)=>t+x.monthly,0));
    return {bank,list,balance,excl,avail,target,gap:r2(avail-target)}})
}

    <div class="rows">${b.list.map(x=>`<div class="row"><span class="t"><b>${esc(x.name)}${x.no?` <span class="muted num" style="font-weight:400">#${esc(x.no)}</span>`:""}</b><small>Due ${dLong(x.date)} · ${when(x)}</small></span><span class="r">${money(x.amount)}<br><small class="muted">${x.shares>1?`1/${x.shares} this month · `:"full amount · "}<span class="num">${f2(x.monthly)}</span></small></span></div>`).join("")}</div>

    <div class="kv"><span><b>${b.gap<0?"Short":"Extra after target"}</b></span><b>${money(Math.abs(b.gap),b.gap<0?"neg":"pos")}</b></div>`).join('<div style="border-top:2px solid var(--line);margin:12px 0 8px"></div>');
  return `<section class="card">${head}<p class="lbl" style="margin:-4px 0 4px">The next cheque of each set, split equally over the months left before its month.</p>${blocks}</section>`;
}
function pdcTab(){

function bookFromWorkbook(wb){

  const A=rows("Accounts"),J=rows("Journal"),P=rows("Plans")||[],St=rows("Settings")||[];

    if(!e){e={id,date:xIso(r.Date),memo:String(r.Note||""),lines:[],t:null};map.set(id,e)}

    e.lines.push({a:String(r["Account ID"]),dr:r2(r.Debit),cr:r2(r.Credit)})}
  B.entries=[...map.values()].filter(e=>ISO_RE.test(e.date)&&e.lines.length>=2);
  B.schedules=P.map(r=>{try{return JSON.parse(r.Data)}catch(x){return null}}).filter(Boolean);

  return B;
}

  let f=(await dList(`name=${dq("FinTrack")} and mimeType='application/vnd.google-apps.folder' and trashed=false`,"&orderBy=createdTime"))[0];
  if(!f)f=await(await dfetch(`${DRV}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"FinTrack",mimeType:"application/vnd.google-apps.folder"})})).json();
  GA.patch({folder:f.id});return f.id}
async function dLatest(folder){const g=GA.get();
  if(g.latest){try{const f=await(await dfetch(`${DRV}/files/${g.latest}?fields=id,name,modifiedTime,appProperties,trashed`)).json();if(!f.trashed)return f}catch(e){if(e.status!==404)throw e}GA.patch({latest:""})}
  const f=(await dList(`name=${dq(LATEST)} and ${dq(folder)} in parents and trashed=false`,"&orderBy=modifiedTime desc"))[0]||null;
  if(f)GA.patch({latest:f.id});return f}
async function dPut(id,meta,blob){const b="ftb"+uid()+uid();
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${XMIME}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return(await dfetch(`${UPL}/files${id?"/"+id:""}?uploadType=multipart&fields=id,modifiedTime,appProperties`,{method:id?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body})).json()}
async function dPrune(folder){try{const list=(await dList(`name contains 'FinTrack-backup-' and ${dq(folder)} in parents and trashed=false`,"&orderBy=name desc")).filter(f=>/^FinTrack-backup-\d{4}-\d\d-\d\d\.xlsx$/.test(f.name));
  for(const f of list.slice(30))await dfetch(`${DRV}/files/${f.id}?fields=id`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})})}catch(e){}}
async function dDownload(f){const r=await dfetch(`${DRV}/files/${f.id}?alt=media`);return bookFromWorkbook(XLSX.read(await r.arrayBuffer(),{type:"array"}))}

/* backup: upload this phone's book */
async function gBackup(force){
  if(!signedIn()||S.demo||!window.XLSX)return;
  if(gBusy){gAgain=true;return}
  if(!navigator.onLine){paintTop();return}
  gBusy=true;paintTop();
  let retried=false;
  const run=async()=>{
    const folder=await dFolder(),latest=await dLatest(folder),g=GA.get(),ap0=(latest&&latest.appProperties)||{};
    if(!force&&latest&&ap0.ftRev&&ap0.ftRev!==g.rev&&ap0.ftDevice!==deviceId())return latest;
    const rev=uid()+uid(),ap={ftRev:rev,ftDevice:deviceId(),ftEntries:String(S.entries.length)};
    const blob=new Blob([XLSX.write(backupWorkbook(),{bookType:"xlsx",type:"array"})],{type:XMIME});
    const up=await dPut(latest?latest.id:null,latest?{appProperties:ap}:{name:LATEST,parents:[folder],mimeType:XMIME,appProperties:ap},blob);
    const dn="FinTrack-backup-"+today()+".xlsx";let did=g.daily&&g.daily.name===dn?g.daily.id:"";
    if(!did){const f=(await dList(`name=${dq(dn)} and ${dq(folder)} in parents and trashed=false`))[0];did=f?f.id:""}
    const du=await dPut(did||null,did?{appProperties:ap}:{name:dn,parents:[folder],mimeType:XMIME,appProperties:ap},blob);
    GA.patch({latest:up.id,daily:{name:dn,id:du.id},rev,pending:false,lastSync:Date.now(),err:"",conflictId:""});
    if(!did)dPrune(folder);
    return null};
  let conflict=null;
  try{conflict=await run()}
  catch(e){
    if(e.status===404&&!retried){retried=true;GA.patch({folder:"",latest:"",daily:null});try{conflict=await run()}catch(e2){e=e2}}
    if(GA.get().pending){if(e.auth){if(NATIVE)GA.patch({reconnect:true})}else if(!e.net)GA.patch({err:e.message})}
  }
  gBusy=false;paintTop();if(U.page==="settings")render();
  if(conflict){gConflict(conflict);return}
  if(gAgain){gAgain=false;if(GA.get().pending)gBackup()}
}
/* check Drive for changes from another device */
async function gCheck(){
  if(!signedIn()||!navigator.onLine||gBusy||!(tokenOk()||NATIVE))return;
  gLastCheck=Date.now();
  try{const folder=await dFolder(),f=await dLatest(folder),g=GA.get();
    if(!f){if(!S.demo&&g.pending)gBackup();return}
    const ap=f.appProperties||{};
    if(ap.ftRev&&ap.ftRev!==g.rev&&ap.ftDevice!==deviceId()){
      if(S.demo||(!g.pending&&!dirty)){const B=await dDownload(f);const first=S.demo;gApply(B,f);toast(first?"Welcome back. Your book was restored from Google Drive.":"Updated with changes from your other device.")}
      else gConflict(f)}
    else if(g.pending&&!dirty)gBackup();
  }catch(e){if(!e.auth&&!e.net)GA.patch({err:e.message});paintTop()}}
function gApply(B,f){
  S=Object.assign(blankBook(),B);S.demo=false;fixDash();ls.set("tapledger.v1",JSON.stringify(S));dirty=false;
  GA.patch({latest:f.id,rev:(f.appProperties||{}).ftRev||"",pending:false,lastSync:Date.now(),conflictId:"",err:""});paintTop();render()}
function gConflict(remote){
  const ap=remote.appProperties||{};GA.patch({conflictId:remote.id});paintTop();
  openSheet(head("Two versions of your book")+`<p style="margin-top:0">Your Google Drive has a version saved ${remote.modifiedTime?"on "+esc(whenText(Date.parse(remote.modifiedTime))):""} from another device${ap.ftEntries?` (${esc(ap.ftEntries)} entries)`:""}. This phone has ${S.entries.length} entries${GA.get().pending?", including changes that are not backed up yet":""}.</p>
  <p class="lbl">Whichever you choose, the daily copies of earlier days stay in the FinTrack folder in your Google Drive.</p>
  <div class="acts"><button class="btn" data-act="gUseDrive" id="gUseDriveBtn">Use Google Drive version</button><button class="btn pri" data-act="gKeepPhone">Keep this phone's version</button></div>`)}

function showLogin(msg,isErr){const l=$("#login");l.hidden=false;$("#app").setAttribute("aria-hidden","true");loginMsg(msg||"",isErr)}
function hideLogin(){$("#login").hidden=true;$("#app").removeAttribute("aria-hidden")}
function loginMsg(t,isErr){const m=$("#loginMsg");m.textContent=t||"";m.classList.toggle("err",!!isErr);const b=$("#gLoginBtn");b.disabled=/…$/.test(t||"")}
function gSetUser(user){const old=GA.get(),ow=ls.get("tapledger.owner");const same=!ow||ow===user.email;
  GA.set(Object.assign(same?old:{token:old.token,exp:old.exp},{user,owner:user.email,reconnect:false,backoff:0}));ls.set("tapledger.owner",user.email)}
async function gAfterLogin(profile){
  loginMsg("Signing in…");profile=profile||{};
  let u={};try{u=await(await dfetch("https://www.googleapis.com/oauth2/v3/userinfo")).json()}catch(e){if(!profile.email){loginMsg(e.net?"No internet connection. Connect and try again.":"Could not finish signing in. Please try again.",true);return}}
  const user={id:u.sub||profile.id||"",email:u.email||profile.email||"",name:u.name||profile.name||u.email||profile.email||"",picture:u.picture||profile.imageUrl||""};
  const owner=ls.get("tapledger.owner");
  if(owner&&user.email&&owner!==user.email&&!S.demo){gSwitchAccount(owner,user);return}
  gSetUser(user);
  if(!S.demo&&!GA.get().lastSync)GA.patch({pending:true});
  hideLogin();render();paintTop();toast("Signed in as "+(user.name||user.email));
  gCheck();
}
function gSwitchAccount(owner,user){

  <p class="lbl">${esc(owner)}'s book will be removed from this phone. ${pend?"Its latest changes are <b>not backed up yet</b>, so they would be lost. Cancel and sign in as "+esc(owner)+" first to back them up.":"It stays safe in "+esc(owner)+"'s Google Drive."}</p>

function gSync(){if(!signedIn()||S.demo)return;if(!navigator.onLine){paintTop();return}

function gStatus(){const g=GA.get();

  if(g.conflictId)return["Choose version","warn"];

function gStatusLong(){const g=GA.get();

  if(g.conflictId)return"Waiting for you to choose between this phone's version and the one in Google Drive.";
  if(g.pending){if(!navigator.onLine)return"Offline. Your changes are saved on this phone and will back up when you're online.";
