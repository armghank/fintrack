# Every time you upload a change to the main branch, GitHub:
#   1. builds the Android app (fintrack.apk), signed with your private key
#   2. publishes it as a Release (download link for family)
#   3. puts the web app + the APK on GitHub Pages (iPhone users install from Safari)
name: Build FinTrack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fintrack-build
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Stamp version
        run: |
          sed -i "s/fintrack-BUILD/fintrack-${{ github.run_number }}/" www/sw.js
          sed -i 's/const APP_VERSION="1.0"/const APP_VERSION="1.0.${{ github.run_number }}"/' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx -y @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#2f4fd8' --iconBackgroundColorDark '#2f4fd8' --splashBackgroundColor '#f3f5f8' --splashBackgroundColorDark '#0d1016'
          npx cap sync android

      - name: Load signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fintrack.keystore"
            echo "FT_KEYSTORE=$RUNNER_TEMP/fintrack.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. This APK uses a temporary key, so future updates will not install over it. Add the secrets from the README."
          fi

      - name: Build APK
        working-directory: android
        env:
          FT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PftVersionCode=${{ github.run_number }} -PftVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../fintrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fintrack-apk
          path: fintrack.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FinTrack 1.0.${{ github.run_number }}
          body: "Android: download fintrack.apk and install. iPhone: open the GitHub Pages link in Safari and Add to Home Screen."
          files: fintrack.apk
          make_latest: true

  site:
    name: Web app (iPhone) on GitHub Pages
    needs: android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install.html
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          sed -i "s/fintrack-BUILD/fintrack-${{ github.run_number }}/" www/sw.js
          sed -i 's/const APP_VERSION="1.0"/const APP_VERSION="1.0.${{ github.run_number }}"/' www/index.html

      - uses: actions/download-artifact@v4
        with:
          name: fintrack-apk
          path: www

      - name: Write update info (Android apps check this to offer updates)
        env:
          N: ${{ github.run_number }}
        run: |
          node -e '
            const fs=require("fs");
            let notes="";try{notes=fs.readFileSync("whats-new.txt","utf8").trim()}catch(e){}
            fs.writeFileSync("www/version.json",JSON.stringify({version:"1.0."+process.env.N,code:Number(process.env.N),apk:"fintrack.apk",notes,date:new Date().toISOString()},null,1));
          '
          cat www/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deploy
        uses: actions/deploy-pages@v4
